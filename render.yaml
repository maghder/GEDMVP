services:
  - type: web
    name: novareg-gedmvp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true

    envVars:
      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 10000

      - key: SECRET
        generateValue: true

      - key: DB_CLIENT
        value: pg

      - key: DB_CONNECTION_STRING
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: WEBSOCKETS_ENABLED
        value: "true"

      - key: TELEMETRY
        value: "false"
